<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3936"/>
      <stop offset="50%" stop-color="#24302d"/>
      <stop offset="100%" stop-color="#18211f"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Icon Graphic Group -->
  <g filter="url(#dropShadow)">
    <!-- Outer Circular Recycle Loop (Bio-Mining / MRF Emblem) -->
    <path d="M 256 96 A 160 160 0 0 1 416 256 A 160 160 0 0 1 296 412" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Arrow Head Top Right -->
    <path d="M 390 120 L 424 96 L 436 136 Z" fill="url(#emeraldGrad)"/>

    <!-- Bottom Left Secondary Arc -->
    <path d="M 216 100 A 160 160 0 0 0 96 256 A 160 160 0 0 0 216 412" 
          fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-dasharray="280 40"/>

    <!-- Arrow Head Bottom Left -->
    <path d="M 122 392 L 88 416 L 76 376 Z" fill="url(#goldGrad)"/>

    <!-- Dashboard Bar Chart Indicators (Bio-Mining / MRF Production Metrics) -->
    <rect x="176" y="260" width="32" height="100" rx="8" fill="url(#paperGrad)"/>
    <rect x="240" y="200" width="32" height="160" rx="8" fill="url(#goldGrad)"/>
    <rect x="304" y="150" width="32" height="210" rx="8" fill="url(#emeraldGrad)"/>

    <!-- Subtle Metric Sparkle / Pin -->
    <circle cx="320" cy="150" r="10" fill="#ffffff" filter="url(#innerGlow)"/>
  </g>
</svg>