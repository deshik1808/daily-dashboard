<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pure White Base -->
  <rect width="512" height="512" rx="108" fill="#ffffff"/>
  
  <!-- Subtle Outer Hairline Border for Light Themes -->
  <rect width="512" height="512" rx="108" fill="none" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Minimalist Black Bar Chart Emblem -->
  <g fill="#1e2624">
    <!-- Baseline -->
    <rect x="96" y="364" width="320" height="14" rx="7"/>

    <!-- Bar 1 (Left) -->
    <rect x="132" y="240" width="52" height="100" rx="10"/>

    <!-- Bar 2 (Center) -->
    <rect x="220" y="170" width="52" height="170" rx="10"/>

    <!-- Bar 3 (Right) -->
    <rect x="308" y="104" width="52" height="236" rx="10"/>
  </g>
</svg>